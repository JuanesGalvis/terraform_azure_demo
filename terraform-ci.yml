name: 🚀 Terraform CI — Deploy · Test · Destroy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  TF_VERSION: "1.7.5"
  AZURE_REGION: "East US"

jobs:
  # ============================================================
  # JOB 1 — Crear la infraestructura en Azure
  # ============================================================
  deploy:
    name: 1️⃣ Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      hello_url:   ${{ steps.tf_output.outputs.hello_url }}
      goodbye_url: ${{ steps.tf_output.outputs.goodbye_url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Instala node_modules en cada función antes de zippear
      - name: 📦 Install Hello dependencies
        run: npm install --prefix functions/hello

      - name: 📦 Install Goodbye dependencies
        run: npm install --prefix functions/goodbye

      # Login en Azure usando el Service Principal
      # (equivalente a AWS_ACCESS_KEY_ID / SECRET)
      - name: 🔑 Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🛠️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: ⚙️ Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

      - name: ✅ Terraform Validate
        run: terraform validate

      - name: 📋 Terraform Plan
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'tf-demo' }}
          TF_VAR_environment:  ${{ vars.TF_ENVIRONMENT  || 'dev'     }}
          TF_VAR_azure_region: ${{ env.AZURE_REGION }}

      - name: 🚀 Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'tf-demo' }}
          TF_VAR_environment:  ${{ vars.TF_ENVIRONMENT  || 'dev'     }}
          TF_VAR_azure_region: ${{ env.AZURE_REGION }}

      - name: 📤 Capture Terraform Outputs
        id: tf_output
        run: |
          echo "hello_url=$(terraform output -raw hello_function_url)"     >> $GITHUB_OUTPUT
          echo "goodbye_url=$(terraform output -raw goodbye_function_url)" >> $GITHUB_OUTPUT
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

  # ============================================================
  # JOB 2 — Probar las Functions
  # Azure Functions HTTP se prueban con curl (no con CLI)
  # ============================================================
  test:
    name: 2️⃣ Test Functions
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      # Espera unos segundos para que las functions "arranquen"
      # (cold start en Consumption Plan puede tardar ~10s)
      - name: ⏳ Wait for cold start
        run: sleep 20

      - name: 🧪 Test Hello (sin parámetro)
        run: |
          URL="${{ needs.deploy.outputs.hello_url }}"
          echo "Invocando: $URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Body: $BODY"

          [ "$HTTP_CODE" = "200" ] || (echo "❌ Hello falló con HTTP $HTTP_CODE" && exit 1)
          echo "$BODY" | grep -q "Hola" || (echo "❌ Respuesta inesperada" && exit 1)

      - name: 🧪 Test Hello (con nombre)
        run: |
          URL="${{ needs.deploy.outputs.hello_url }}?nombre=GitHubActions"
          RESPONSE=$(curl -s -w "\n%{http_code}" "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Body: $BODY"

          [ "$HTTP_CODE" = "200" ] || (echo "❌ Hello con nombre falló con HTTP $HTTP_CODE" && exit 1)
          echo "$BODY" | grep -q "GitHubActions" || (echo "❌ El nombre no aparece en la respuesta" && exit 1)

      - name: 🧪 Test Goodbye
        run: |
          URL="${{ needs.deploy.outputs.goodbye_url }}?nombre=GitHubActions"
          RESPONSE=$(curl -s -w "\n%{http_code}" "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Body: $BODY"

          [ "$HTTP_CODE" = "200" ] || (echo "❌ Goodbye falló con HTTP $HTTP_CODE" && exit 1)

      - name: ✅ All tests passed
        run: echo "✅ Las dos Azure Functions respondieron correctamente."

  # ============================================================
  # JOB 3 — Destruir toda la infraestructura
  # Corre SIEMPRE, incluso si los tests fallaron
  # ============================================================
  destroy:
    name: 3️⃣ Terraform Destroy
    runs-on: ubuntu-latest
    needs: [deploy, test]
    if: always() && needs.deploy.result == 'success'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install Hello dependencies
        run: npm install --prefix functions/hello

      - name: 📦 Install Goodbye dependencies
        run: npm install --prefix functions/goodbye

      - name: 🔑 Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🛠️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: ⚙️ Terraform Init
        run: terraform init
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

      - name: 💣 Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'tf-demo' }}
          TF_VAR_environment:  ${{ vars.TF_ENVIRONMENT  || 'dev'     }}
          TF_VAR_azure_region: ${{ env.AZURE_REGION }}

      - name: ✅ Infrastructure cleaned up
        run: echo "✅ Toda la infraestructura eliminada. Sin costos residuales."
